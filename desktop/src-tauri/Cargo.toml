[package]
name = "conceal-desktop"
version = "4.3.0-rc.1"
description = "Review exact service actions before Conceal uses a credential"
authors = ["Joe Garcia"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.92.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
