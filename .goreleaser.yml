version: 2
project_name: conceal

builds:
  - id: cross-platform
    env: [CGO_ENABLED=0]
    goos: [linux, windows]
    goarch: ['386', amd64, arm64]
    ignore:
      - goos: windows
        goarch: '386'
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/infamousjoeg/conceal/pkg/conceal.Version={{.Version}}
      - -X github.com/infamousjoeg/conceal/pkg/conceal.Tag=
    binary: conceal
  - id: darwin
    env: [CGO_ENABLED=1, MACOSX_DEPLOYMENT_TARGET=13.0]
    goos: [darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/infamousjoeg/conceal/pkg/conceal.Version={{.Version}}
      - -X github.com/infamousjoeg/conceal/pkg/conceal.Tag=
    binary: conceal

archives:
  - name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files: [README.md, LICENSE, SECURITY.md, CONTRIBUTING.md, 'docs/*.md', 'docs/playground.html', 'examples/*']
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
snapshot:
  version_template: '4.3.0-rc.1+{{ .ShortCommit }}'
changelog:
  sort: asc
  filters:
    exclude: ['^docs:', '^test:']
release:
  github:
    owner: infamousjoeg
    name: conceal
  draft: false
  prerelease: auto
  mode: keep-existing
  header: |
    Conceal manages local secrets and executes approved actions using native
    macOS Keychain, Windows Credential Manager, and Linux kernel keyring backends.
  footer: |
    Download the archive for your platform and verify it against checksums.txt.
    Prerelease versions are available here; package managers continue to serve stable releases.
    These archives are not Developer ID signed or notarized.
