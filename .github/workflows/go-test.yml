name: Go Test

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'v*']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.26.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Unit tests and race detector
        run: go test -race -count=1 '-coverprofile=coverage.out' -covermode=atomic ./...
      - name: Create isolated macOS test keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          password=$(uuidgen)
          security create-keychain -p "$password" "$RUNNER_TEMP/conceal-test.keychain-db"
          security set-keychain-settings -lut 3600 "$RUNNER_TEMP/conceal-test.keychain-db"
          security unlock-keychain -p "$password" "$RUNNER_TEMP/conceal-test.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/conceal-test.keychain-db"
      - name: Native credential store lifecycle
        env:
          CONCEAL_INTEGRATION: '1'
        run: go test -count=1 -v ./pkg/conceal/keychain
      - name: Remove macOS test keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [[ -f "$RUNNER_TEMP/conceal-test.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/conceal-test.keychain-db"
          fi
      - name: Build native CLI
        run: go build -trimpath -o bin/ .
      - name: CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          binary=./bin/conceal
          if [[ "$RUNNER_OS" == Windows ]]; then binary=./bin/conceal.exe; fi
          "$binary" version
          "$binary" action example > example.json
          "$binary" action validate example.json
          "$binary" run --help
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}-go-${{ matrix.go }}
          path: |
            bin/
            coverage.out
          if-no-files-found: error

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Windows and Linux release architectures
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/386 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "bin/conceal-$os-$arch" .
          done
