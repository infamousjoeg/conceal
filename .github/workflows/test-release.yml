name: Test Release Configuration

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.20.0
          args: check
      - name: Build every release archive without publishing
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.20.0
          args: release --snapshot --clean --skip=publish
      - name: Verify archive contents, architectures, and checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import platform
          import struct
          import subprocess
          import tarfile
          import tempfile
          import zipfile

          root = pathlib.Path("dist")
          archives = {
              "conceal_Darwin_x86_64.tar.gz": ("darwin", 0x01000007),
              "conceal_Darwin_arm64.tar.gz": ("darwin", 0x0100000C),
              "conceal_Linux_x86_64.tar.gz": ("linux", 62),
              "conceal_Linux_arm64.tar.gz": ("linux", 183),
              "conceal_Linux_i386.tar.gz": ("linux", 3),
              "conceal_Windows_x86_64.zip": ("windows", 0x8664),
              "conceal_Windows_arm64.zip": ("windows", 0xAA64),
          }
          required = {
              "README.md", "LICENSE", "docs/actions.md", "docs/playground.html",
              "examples/github-contract.json", "examples/list-issues.json",
              "examples/draft-pull-request.json",
          }
          checksums = dict(
              reversed(line.split(maxsplit=1))
              for line in (root / "checksums.txt").read_text().splitlines()
          )
          verified_native = False
          for name, (system, machine) in archives.items():
              path = root / name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == checksums[name], name
              binary = "conceal.exe" if system == "windows" else "conceal"
              if system == "windows":
                  with zipfile.ZipFile(path) as archive:
                      members = set(archive.namelist())
                      data = archive.read(binary)
              else:
                  with tarfile.open(path) as archive:
                      members = set(archive.getnames())
                      data = archive.extractfile(binary).read()
              assert required | {binary} <= members, (name, members)
              if system == "windows":
                  assert data[:2] == b"MZ", name
                  header = struct.unpack_from("<I", data, 0x3C)[0]
                  assert data[header:header + 4] == b"PE\0\0", name
                  actual = struct.unpack_from("<H", data, header + 4)[0]
              elif system == "linux":
                  assert data[:4] == b"\x7fELF" and data[5] == 1, name
                  actual = struct.unpack_from("<H", data, 18)[0]
              else:
                  assert data[:4] == b"\xcf\xfa\xed\xfe", name
                  actual = struct.unpack_from("<I", data, 4)[0]
              assert actual == machine, (name, actual, machine)
              if system == "darwin" and platform.machine() in name:
                  with tempfile.TemporaryDirectory() as directory:
                      executable = pathlib.Path(directory) / "conceal"
                      executable.write_bytes(data)
                      executable.chmod(0o700)
                      version = subprocess.check_output([executable, "version"], text=True)
                      assert version.startswith("conceal v4.3.0-rc.1+"), version
                      subprocess.run([executable, "action", "example"], check=True, stdout=subprocess.DEVNULL)
                      verified_native = True
              print("Verified", name)
          assert verified_native, "native macOS archive was not executed"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-packages
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error

  workflow-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
